<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1170" viewBox="0 0 1800 1170" role="img"><title>BrainFusion AI · DICOM 数据关系与来源绑定</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52677e"/></marker><marker id="warn" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a85b0b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17283e}.title{font-size:36px;font-weight:700}.sub{font-size:22px;fill:#52677e}.box-title{font-size:24px;font-weight:700}.body{font-size:21px}.note{font-size:20px;fill:#52677e}</style><rect width="100%" height="100%" fill="white"/><text x="60" y="65" class="title">BrainFusion AI · DICOM 数据关系与来源绑定</text><text x="60" y="108" class="sub">2026-10-16工程材料 | 17 张业务表中的 DICOM 子图；不是全库 ER 图</text><g><rect id="archive" x="60" y="175" width="460" height="180" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="82" y="215" class="box-title" data-box="archive">Orthanc（库外归档）</text><text x="82" y="253" class="body" data-box="archive">Study / Series / Instance UID</text><text x="82" y="285" class="body" data-box="archive">DICOM 原文件与归档索引</text><text x="82" y="317" class="body" data-box="archive">不存于业务 SQL 实例表</text></g><g><rect id="links" x="650" y="175" width="480" height="180" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="672" y="215" class="box-title" data-box="links">pacs_study_links</text><text x="672" y="253" class="body" data-box="links">case_id → cases.id（声明外键）</text><text x="672" y="285" class="body" data-box="links">archive_id / Study UID</text><text x="672" y="317" class="body" data-box="links">归档指纹与元数据快照</text></g><g><rect id="cases" x="1320" y="175" width="420" height="180" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="1342" y="215" class="box-title" data-box="cases">cases / 病例</text><text x="1342" y="253" class="body" data-box="cases">业务病例 ID</text><text x="1342" y="285" class="body" data-box="cases">病例与归档显式关联</text><text x="1342" y="317" class="body" data-box="cases">单病例可有多条检查关联</text></g><path d="M1320,263 H1130" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1140" y="246" class="note">1 → 多（声明）</text><path d="M520,263 H650" fill="none" stroke="#a85b0b" stroke-width="2.3" marker-end="url(#warn)" stroke-dasharray="10 7"/><text x="530" y="246" class="note">UID / 来源</text><g><rect id="context" x="650" y="435" width="480" height="175" rx="12" fill="#f0f8f4" stroke="#176957" stroke-width="2"/><text x="672" y="475" class="box-title" data-box="context">运行时来源上下文</text><text x="672" y="513" class="body" data-box="context">病例检查关联 ID / 归档指纹</text><text x="672" y="545" class="body" data-box="context">Study / Series / FrameOfReference</text><text x="672" y="577" class="body" data-box="context">元数据 SHA-256（非逐次像素全哈希）</text></g><path d="M890,355 V435" fill="none" stroke="#a85b0b" stroke-width="2.3" marker-end="url(#warn)" stroke-dasharray="10 7"/><text x="910" y="402" class="note">每次核对</text><g><rect id="opinion" x="1320" y="435" width="420" height="175" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="1342" y="475" class="box-title" data-box="opinion">doctor_opinions</text><text x="1342" y="513" class="body" data-box="opinion">case_id → cases.id（唯一）</text><text x="1342" y="545" class="body" data-box="opinion">病例级独立意见</text><text x="1342" y="577" class="body" data-box="opinion">不等于本序列人工复核</text></g><path d="M1530,355 V435" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1555" y="402" class="note">0 或 1</text><g><rect id="measure" x="60" y="760" width="460" height="185" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="82" y="800" class="box-title" data-box="measure">dicom_world_measurements</text><text x="82" y="838" class="body" data-box="measure">case_id / Study / Series UID</text><text x="82" y="870" class="body" data-box="measure">context_json / 患者 LPS 端点</text><text x="82" y="902" class="body" data-box="measure">length_mm / 不可变 client_uid</text><text x="82" y="934" class="body" data-box="measure">旧来源记录保留但不当当前</text></g><g><rect id="views" x="650" y="760" width="480" height="185" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="672" y="800" class="box-title" data-box="views">dicom_view_states</text><text x="672" y="838" class="body" data-box="views">case_id / Study / Series UID</text><text x="672" y="870" class="body" data-box="views">context_json / state_json</text><text x="672" y="902" class="body" data-box="views">三相机与窗值 / 不可变版本</text><text x="672" y="934" class="body" data-box="views">当前来源一致时才恢复</text></g><g><rect id="reviews" x="1320" y="760" width="420" height="185" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="1342" y="800" class="box-title" data-box="reviews">dicom_reading_reviews</text><text x="1342" y="838" class="body" data-box="reviews">case_id / 来源与内容 SHA</text><text x="1342" y="870" class="body" data-box="reviews">snapshot_json（含 review_actor）</text><text x="1342" y="902" class="body" data-box="reviews">署名 / 意见 / 复核状态</text><text x="1342" y="934" class="body" data-box="reviews">内容变更后历史仍可追溯</text></g><path d="M750,610 V665 H290 V760" fill="none" stroke="#a85b0b" stroke-width="2.3" marker-end="url(#warn)" stroke-dasharray="10 7"/><path d="M890,610 V760" fill="none" stroke="#a85b0b" stroke-width="2.3" marker-end="url(#warn)" stroke-dasharray="10 7"/><path d="M1030,610 V665 H1530 V760" fill="none" stroke="#a85b0b" stroke-width="2.3" marker-end="url(#warn)" stroke-dasharray="10 7"/><path d="M1660,355 H1770 V710 H180 V760" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1320" y="697" class="note">case_id 声明关联（各子表）</text><path d="M1070,710 V760" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1710,710 V760" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><text x="60" y="1030" class="note">实线：SQLAlchemy 声明的病例关系；同类记录均声明 case_id → cases.id，不据此声称 SQLite 强制外键已开启。</text><text x="60" y="1070" class="note">虚线：服务端逻辑核对或库外绑定，不是 SQL 外键。复核内容 SHA 不含复核本身，导出 SHA 含最新复核状态。</text><text x="60" y="1110" class="note">本地账户存在私有 LOCAL_AUTH_FILE；仅将 actor 写入复核快照。账户不是 SQL 表，会话不备份、不证明医师资质。</text><text x="60" y="1150" class="note">联合恢复还需原实例、索引、导入来源 / 回执、账户与运行路径；只复制 SQLite 不构成完整系统恢复。</text></svg>