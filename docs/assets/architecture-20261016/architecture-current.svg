<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img"><title>BrainFusion AI · 当前系统架构</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#52677e"/></marker><marker id="warn" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a85b0b"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17283e}.title{font-size:36px;font-weight:700}.sub{font-size:22px;fill:#52677e}.box-title{font-size:24px;font-weight:700}.body{font-size:21px}.note{font-size:20px;fill:#52677e}</style><rect width="100%" height="100%" fill="white"/><text x="60" y="65" class="title">BrainFusion AI · 当前系统架构</text><text x="60" y="108" class="sub">2026-10-16工程材料 | 实线为已实现主路径；虚线为真实端到端尚未接通的分支</text><text x="60" y="160" class="sub">受支持 NIfTI 路径</text><g><rect id="nifti" x="60" y="185" width="300" height="155" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="82" y="225" class="box-title" data-box="nifti">四序列 NIfTI</text><text x="82" y="263" class="body" data-box="nifti">T1c / T1n / T2w / FLAIR</text><text x="82" y="295" class="body" data-box="nifti">原网格契约与来源核对</text></g><g><rect id="ai" x="450" y="185" width="355" height="155" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="472" y="225" class="box-title" data-box="ai">FastAPI / 现有 AI</text><text x="472" y="263" class="body" data-box="ai">固定 MONAI 真实分割</text><text x="472" y="295" class="body" data-box="ai">自动掩膜特征与研究预测</text></g><g><rect id="outputs" x="910" y="185" width="355" height="155" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="932" y="225" class="box-title" data-box="outputs">版本与文件产物</text><text x="932" y="263" class="body" data-box="outputs">MRI / 原分割只读 mask</text><text x="932" y="295" class="body" data-box="outputs">输入、模型与分析来源</text></g><g><rect id="viewn" x="1370" y="185" width="365" height="155" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="1392" y="225" class="box-title" data-box="viewn">Vue3 / Cornerstone3D</text><text x="1392" y="263" class="body" data-box="viewn">同一现有工作站入口</text><text x="1392" y="295" class="body" data-box="viewn">三视图、四序列与工具</text></g><path d="M360,262 H450" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M805,262 H910" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1265,262 H1370" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><text x="60" y="430" class="sub">受支持 DICOM 路径</text><g><rect id="dicom" x="60" y="455" width="300" height="170" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="82" y="495" class="box-title" data-box="dicom">获准公开经典 MR</text><text x="82" y="533" class="body" data-box="dicom">来源与像素复核证据</text><text x="82" y="565" class="body" data-box="dicom">受控准备、登记及导入</text><text x="82" y="597" class="body" data-box="dicom">非任意上传 / 自动脱敏</text></g><g><rect id="orthanc" x="450" y="455" width="355" height="170" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="472" y="495" class="box-title" data-box="orthanc">本机 Orthanc</text><text x="472" y="533" class="body" data-box="orthanc">DICOMweb / 实例归档</text><text x="472" y="565" class="body" data-box="orthanc">Study / Series / Instance</text><text x="472" y="597" class="body" data-box="orthanc">凭据仅后端持有</text></g><g><rect id="proxy" x="910" y="455" width="355" height="170" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="932" y="495" class="box-title" data-box="proxy">后端核对与鉴权代理</text><text x="932" y="533" class="body" data-box="proxy">UID 显式病例关联</text><text x="932" y="565" class="body" data-box="proxy">元数据、几何与来源版本</text><text x="932" y="597" class="body" data-box="proxy">导入回执持久化</text></g><g><rect id="viewd" x="1370" y="455" width="365" height="170" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="1392" y="495" class="box-title" data-box="viewd">同一 Cornerstone 工作站</text><text x="1392" y="533" class="body" data-box="viewd">真实 DICOM 三视图</text><text x="1392" y="565" class="body" data-box="viewd">LPS 毫米距离 / 视图</text><text x="1392" y="597" class="body" data-box="viewd">本分支尚无模型分割</text></g><path d="M360,540 H450" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M805,540 H910" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1265,540 H1370" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M628,455 V380 H815 V315 H805" fill="none" stroke="#a85b0b" stroke-width="2.3" marker-end="url(#warn)" stroke-dasharray="10 7"/><text x="840" y="397" class="note">匹配真实四序列 / 转换登记与模型激活：受阻</text><g><rect id="account" x="60" y="820" width="300" height="200" rx="12" fill="#f0f8f4" stroke="#176957" stroke-width="2"/><text x="82" y="860" class="box-title" data-box="account">本机复核账户</text><text x="82" y="898" class="body" data-box="account">私有配置 / 盐化摘要</text><text x="82" y="930" class="body" data-box="account">doctor 角色与会话</text><text x="82" y="962" class="body" data-box="account">仅约束 DICOM 复核</text><text x="82" y="994" class="body" data-box="account">不等于医师资质</text></g><g><rect id="db" x="450" y="820" width="355" height="200" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="472" y="860" class="box-title" data-box="db">SQLite 业务库</text><text x="472" y="898" class="body" data-box="db">当前 17 表</text><text x="472" y="930" class="body" data-box="db">距离 / 视图 / 复核快照</text><text x="472" y="962" class="body" data-box="db">结果与分析版本关联</text><text x="472" y="994" class="body" data-box="db">病例意见保持独立</text></g><g><rect id="backup" x="910" y="820" width="355" height="200" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="932" y="860" class="box-title" data-box="backup">联合恢复边界</text><text x="932" y="898" class="body" data-box="backup">归档索引与原实例</text><text x="932" y="930" class="body" data-box="backup">业务库、产物与模型来源</text><text x="932" y="962" class="body" data-box="backup">登记 / 回执 / 账户配置</text><text x="932" y="994" class="body" data-box="backup">须实际独立恢复验证</text></g><g><rect id="report" x="1370" y="820" width="365" height="200" rx="12" fill="#f0f6fb" stroke="#16649c" stroke-width="2"/><text x="1392" y="860" class="box-title" data-box="report">现有报告页 / PDF</text><text x="1392" y="898" class="body" data-box="report">来源与内容版本核对</text><text x="1392" y="930" class="body" data-box="report">本地账户复核 / 历史</text><text x="1392" y="962" class="body" data-box="report">导出前后再次核对</text><text x="1392" y="994" class="body" data-box="report">教学研究，不作临床诊断</text></g><path d="M1552,625 V820" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1575" y="722" class="note">同一报告入口</text><path d="M1460,625 V708 H628 V820" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><text x="730" y="698" class="note">测量 / 视图 / 复核持久化</text><path d="M805,935 H850 V1040 H1552 V1020" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><text x="900" y="1075" class="note">报告读取业务版本；备份范围还包含库外文件</text><path d="M360,910 H450" fill="none" stroke="#52677e" stroke-width="2.3" marker-end="url(#arrow)"/><text x="365" y="894" class="note">复核身份</text><text x="60" y="1140" class="note">研究 IDH 仅解释原始目标值；单序列阅片不要求 IDH 标签。Docker / 异机交付与真实四序列桥未通过。</text></svg>