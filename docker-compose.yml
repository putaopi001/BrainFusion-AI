services:
  backend:
    build: ./backend
    container_name: brainfusion-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      DATABASE_URL: sqlite:///./brainfusion.db
      LOG_LEVEL: INFO

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    container_name: brainfusion-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
